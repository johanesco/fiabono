<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo Squircle Obsidiana Profunda -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#111827" />
      <stop offset="100%" stopColor="#0B111E" />
    </linearGradient>

    <!-- Verde Menta / Esmeralda Neón de la imagen de referencia -->
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Resplandor exterior suave neón idéntico a la imagen del celular -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle redondeado estilo App Icon moderno -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Símbolo Monolínea F exacta de las fotos de referencia -->
  <g transform="translate(130, 105) scale(2.6)" filter="url(#neonGlow)">
    <!-- 1. Trazo Superior: Cabeza redondeada de la F que baja verticalmente -->
    <path
      d="M 26 50 
         C 26 24, 40 10, 68 10 
         C 90 10, 102 14, 98 22 
         C 94 28, 76 28, 56 28 
         C 46 28, 44 34, 44 46 
         L 44 80"
      stroke="url(#neonMint)"
      stroke-width="9.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- 2. Brazo Horizontal Medio y Curva Inferior Continua de la F -->
    <path
      d="M 76 46 
         C 54 46, 44 46, 44 46
         C 28 46, 24 58, 24 72 
         C 24 88, 36 94, 44 94 
         C 52 94, 52 86, 52 74 
         L 52 46"
      stroke="url(#neonMint)"
      stroke-width="9.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
